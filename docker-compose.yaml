services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siga-web-admin
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - siga_media:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-siga-dev-secret-key-sprint3}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend-check:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siga-mobile-ci
    profiles: ["test"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  siga_media: